version: '3'
services:
  graph-node:
    image: graphprotocol/graph-node
    # Only the query endpoint (8000) is public. Admin (8020: deploy/remove
    # subgraphs), subscriptions, index status and metrics stay on the host:
    # Docker opens published ports past ufw, so 0.0.0.0 means the internet.
    ports:
      - '8000:8000'
      - '127.0.0.1:8001:8001'
      - '127.0.0.1:8020:8020'
      - '127.0.0.1:8030:8030'
      - '127.0.0.1:8040:8040'
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      ethereum: 'mainnet:https://realio-testnet-json.rpc.decentrio.ventures'
      GRAPH_LOG: info
  ipfs:
    image: ipfs/kubo:v0.17.0
    # Offline: graph-node only reads the files `graph deploy` uploads here, so
    # IPFS needn't join the public swarm, whose dials to private address
    # ranges Hetzner reports as a netscan.
    command: ["daemon", "--migrate=true", "--offline"]
    ports:
      - '127.0.0.1:5001:5001'
    volumes:
      - ./data/ipfs:/data/ipfs:Z
  postgres:
    image: postgres
    ports:
      - '127.0.0.1:5432:5432'
    command:
      [
        "postgres",
        "-cshared_preload_libraries=pg_stat_statements",
        "-cmax_connections=200"
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      # FIXME: remove this env. var. which we shouldn't need. Introduced by
      # <https://github.com/graphprotocol/graph-node/pull/3511>, maybe as a
      # workaround for https://github.com/docker/for-mac/issues/6270?
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
